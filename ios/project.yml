# XcodeGen spec — run `xcodegen generate` (inside ios/) to produce ESR.xcodeproj.
name: ESR
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.itaydre
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer team ID here
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  ESR:
    type: application
    platform: iOS
    sources:
      - path: ESR
    resources:
      - path: ESR/Assets.xcassets
    info:
      path: ESR/Info.plist
      properties:
        CFBundleDisplayName: "Eat Shit Sleep Repeat"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: "AccentColor"
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: false
        CFBundleURLTypes:
          - CFBundleURLName: "com.itaydre.esr"
            CFBundleURLSchemes:
              - "esr"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaydre.esr
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: supabase
        product: Supabase
