<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Onboarding — Eat shit sleep repeat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: inherit;
        }

        body {
            font-family: 'Varela Round', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafaf8;
            color: #1a1a1a;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .onboarding {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        }

        /* Steps */
        .step {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .step.active {
            display: flex;
        }

        .step-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Progress */
        .step-topbar {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        .step-topbar .btn-back {
            position: absolute;
            left: 0;
            margin: 0;
        }

        .progress {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex: 1;
        }

        .progress-dot {
            font-size: 1.2rem;
            opacity: 0.25;
            transition: opacity 0.3s ease, transform 0.3s ease;
            filter: grayscale(1);
        }

        .progress-dot.done {
            opacity: 1;
            filter: grayscale(0);
        }

        .progress-dot.current {
            opacity: 1;
            filter: grayscale(0);
        }

        /* Typography */
        .step-emoji {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .step h2 {
            font-size: 1.5rem;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .step p {
            color: #b5b5b5;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        /* Inputs */
        .input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #f0f0ee;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s;
        }

        .input:focus {
            border-color: #1a1a1a;
        }

        .input + .input {
            margin-top: 12px;
        }

        /* Gender buttons */
        .gender-group {
            display: flex;
            gap: 12px;
        }

        .gender-btn {
            flex: 1;
            padding: 16px;
            border: 2px solid #f0f0ee;
            border-radius: 14px;
            font-size: 1rem;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            text-align: center;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .gender-btn .gender-emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }

        .gender-btn.active {
            border-color: #1a1a1a;
            background: #fafaf8;
        }

        /* Bottom actions */
        .step-actions {
            padding: 16px 0;
            position: relative;
            z-index: 5;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:active {
            opacity: 0.85;
        }

        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-skip {
            width: 100%;
            padding: 12px;
            background: none;
            border: none;
            color: #b5b5b5;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-back {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #b5b5b5;
            padding: 4px 0;
        }

        /* Invite code */
        .invite-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #f0f0ee;
        }

        .invite-label {
            font-size: 0.85rem;
            color: #b5b5b5;
            margin-bottom: 8px;
        }

        /* Summary card */
        .summary-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 0.95rem;
        }

        .summary-row + .summary-row {
            border-top: 1px solid #f0f0ee;
        }

        .summary-label {
            color: #b5b5b5;
        }

        .summary-value {
            color: #1a1a1a;
            font-weight: 600;
        }

        /* Circular Time Picker */
        .time-wheel-label {
            font-size: 0.8rem;
            color: #b5b5b5;
            text-align: center;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .time-circle-wrapper {
            position: relative;
            width: 100vw;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 12px;
            clip-path: ellipse(65% 100% at 50% 100%);
            background: #fff;
            padding: 40px 0 24px;
            flex: 1;
        }

        .time-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            touch-action: none;
            width: 100%;
        }

        .drum-row {
            position: relative;
            width: 100%;
            height: 50px;
            overflow: visible;
        }

        .drum-track {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
        }

        .drum-item {
            position: absolute;
            width: 56px;
            text-align: center;
            font-family: 'Varela Round', sans-serif;
            font-size: 1rem;
            color: #ccc;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            top: -12px;
            left: -28px;
        }

        .drum-item.active {
            color: #1a1a1a;
            font-size: 1.5rem;
            font-weight: 700;
            top: -16px;
        }

        .drum-label {
            font-family: 'Varela Round', sans-serif;
            font-size: 0.55rem;
            color: #b5b5b5;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            margin-bottom: 0;
        }

        /* Bracelet Color Picker */
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .color-dot.active {
            border-color: #1a1a1a;
            transform: scale(1.1);
        }

        .color-dot[data-color="custom"].active {
            border-color: transparent;
            box-shadow: 0 0 0 2px #1a1a1a;
        }

        .color-dot-custom {
            position: relative;
        }

        /* Splash */
        .splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafaf8;
            z-index: 999;
            transition: opacity 0.3s ease;
        }

        .splash-word {
            font-size: 6rem;
            color: #1a1a1a;
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.2s ease;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <!-- Splash -->
    <div class="splash" id="splash">
        <div class="splash-word" id="splash-word"></div>
    </div>

    <div class="onboarding" id="onboarding" style="display:none;">
        <!-- Step 1: Invite Code -->
        <div class="step active" id="step-1">
            <div class="step-content">
                <div class="step-emoji">👋</div>
                <h2>Welcome!</h2>
                <p>Were you invited by a partner?</p>
                <div id="invite-choice" style="display:flex; flex-direction:column; gap:10px;">
                    <button class="btn-primary" onclick="goStep(2)">Start fresh</button>
                    <button onclick="showInviteInput()" style="width:100%; padding:16px; background:#fff; border:1px solid #f0f0ee; border-radius:14px; font-size:1rem; color:#1a1a1a; cursor:pointer; font-family:inherit;">I have an invite code</button>
                </div>
                <div id="invite-input" style="display:none; margin-top:8px;">
                    <input type="text" class="input" id="ob-invite" placeholder="Paste invite code" autofocus>
                    <div style="display:flex; gap:8px; margin-top:12px;">
                        <button onclick="hideInviteInput()" style="flex:1; background:none; border:1px solid #f0f0ee; border-radius:12px; padding:14px; font-size:1rem; color:#b5b5b5; cursor:pointer; font-family:inherit;">Back</button>
                        <button class="btn-primary" id="btn-join" onclick="joinWithCode()" disabled style="flex:2;">Join</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Name -->
        <div class="step" id="step-2">
            <div class="step-topbar">
                <div class="progress" id="progress-2"></div>
            </div>
            <div class="step-content">
                <div class="step-emoji">👶</div>
                <h2>What's your baby's name?</h2>
                <input type="text" class="input" id="ob-name" placeholder="e.g. Maya">
            </div>
            <div class="step-actions">
                <button class="btn-primary" id="btn-step2" onclick="goStep(3)" disabled>Continue</button>
            </div>
        </div>

        <!-- Step 3: Birthday -->
        <div class="step" id="step-3">
            <div class="step-topbar">
                <button class="btn-back" onclick="goStep(2)">&#8249;</button>
                <div class="progress" id="progress-3"></div>
            </div>
            <div class="step-content">
                <div class="step-emoji">🎂</div>
                <h2>When were they born?</h2>
                <input type="date" class="input" id="ob-dob" style="font-size:1.5rem; font-weight:700; text-align:center; border:none; background:none; padding:12px 0;">
                <script>document.getElementById('ob-dob').valueAsDate = new Date();</script>
                <div class="time-wheel-label">Time of birth</div>
                <div class="time-circle-wrapper">
                <div class="time-circle" id="time-circle">
                    <div class="drum-label">HOUR</div>
                    <div class="drum-row" id="drum-hours">
                        <div class="drum-track" id="track-hours"></div>
                    </div>
                    <div style="height:8px;"></div>
                    <div class="drum-label">MINUTE</div>
                    <div class="drum-row" id="drum-minutes">
                        <div class="drum-track" id="track-minutes"></div>
                    </div>
                </div>
                </div>
                <input type="hidden" id="ob-time">
            </div>
            <div class="step-actions">
                <button class="btn-primary" onclick="goStep(4)">Continue</button>
            </div>
        </div>

        <!-- Step 4: Gender & Weight -->
        <div class="step" id="step-4">
            <div class="step-topbar">
                <button class="btn-back" onclick="goStep(3)">&#8249;</button>
                <div class="progress" id="progress-4"></div>
            </div>
            <div class="step-content">
                <div class="step-emoji">⚖️</div>
                <h2>A few more details</h2>
                <div class="gender-group" style="margin-bottom:16px;">
                    <button type="button" class="gender-btn" onclick="pickGender(this, 'boy')">
                        <span class="gender-emoji">👦</span>Boy
                    </button>
                    <button type="button" class="gender-btn" onclick="pickGender(this, 'girl')">
                        <span class="gender-emoji">👧</span>Girl
                    </button>
                </div>
                <input type="number" class="input" id="ob-weight" placeholder="Birth weight in grams (e.g. 3200)">
                <input type="text" class="input" id="ob-hospital" placeholder="Hospital name (e.g. Ichilov)">
            </div>
            <div class="step-actions">
                <button class="btn-primary" onclick="goStep(5)">Continue</button>
            </div>
        </div>

        <!-- Step 5: Summary + Bracelet -->
        <div class="step" id="step-5">
            <div class="step-topbar">
                <button class="btn-back" onclick="goStep(4)">&#8249;</button>
                <div class="progress" id="progress-5"></div>
            </div>
            <div class="step-content" style="justify-content:flex-start; padding-top:20px;">
                <div id="bracelet-container" style="width:100%; height:280px; margin-bottom:8px;"></div>
                <div id="bracelet-colors" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px;">
                    <button class="color-dot active" data-color="#F08080" style="background:#F08080;" onclick="pickBraceletColor(this)"></button>
                    <button class="color-dot" data-color="#7EB8E0" style="background:#7EB8E0;" onclick="pickBraceletColor(this)"></button>
                    <button class="color-dot" data-color="#7ED67E" style="background:#7ED67E;" onclick="pickBraceletColor(this)"></button>
                    <button class="color-dot" data-color="#F5D76E" style="background:#F5D76E;" onclick="pickBraceletColor(this)"></button>
                    <button class="color-dot" data-color="#C8A2E8" style="background:#C8A2E8;" onclick="pickBraceletColor(this)"></button>
                    <button class="color-dot" data-color="#FF9F68" style="background:#FF9F68;" onclick="pickBraceletColor(this)"></button>
                    <button class="color-dot color-dot-custom" data-color="custom" onclick="pickBraceletColor(this)" style="background:conic-gradient(#F08080, #F5D76E, #7ED67E, #7EB8E0, #C8A2E8, #F08080); border-color:transparent;"></button>
                </div>
                <input type="color" id="custom-color-input" style="display:none;" oninput="applyCustomColor(this.value)" onchange="applyCustomColor(this.value)">
                <div class="summary-card" id="summary"></div>
            </div>
            <div class="step-actions">
                <button class="btn-primary" onclick="enterApp()">Let's go 🍼</button>
            </div>
        </div>
    </div>

    <script>
        let selectedGender = '';

        // --- Circular Arc Time Picker ---
        function initTimeWheel() {
            const SPACING = 50; // horizontal px between items
            const VISIBLE_RANGE = 3; // items visible each side of center

            function setupDrum(rowEl, trackEl, values, initialIdx, onChange) {
                let currentIdx = initialIdx;

                // Create items positioned on a 3D cylinder (rotateX)
                values.forEach((val, i) => {
                    const el = document.createElement('div');
                    el.className = 'drum-item';
                    el.textContent = val;
                    el.dataset.idx = i;
                    el.addEventListener('click', () => { setIndex(i, true); });
                    trackEl.appendChild(el);
                });

                function setIndex(idx, animate) {
                    currentIdx = ((idx % values.length) + values.length) % values.length;
                    trackEl.style.transition = animate ? 'transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)' : 'none';
                    // Position each item on the cylinder
                    const items = trackEl.querySelectorAll('.drum-item');
                    items.forEach((el, i) => {
                        const offset = i - currentIdx;
                        // Wrap around for circular feel
                        let wrappedOffset = offset;
                        if (wrappedOffset > values.length / 2) wrappedOffset -= values.length;
                        if (wrappedOffset < -values.length / 2) wrappedOffset += values.length;

                        const isVisible = Math.abs(wrappedOffset) <= VISIBLE_RANGE;
                        const isActive = wrappedOffset === 0;

                        el.style.display = isVisible ? '' : 'none';
                        el.classList.toggle('active', isActive);

                        const x = wrappedOffset * 50;
                        const y = wrappedOffset * -10;
                        const tilt = wrappedOffset * -8;
                        el.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg)`;
                        el.style.opacity = 1;
                    });
                    if (onChange) onChange();
                }

                setIndex(initialIdx, false);

                // Swipe horizontally
                let startX = 0, startIdx = 0, dragging = false;

                rowEl.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startIdx = currentIdx;
                    dragging = true;
                    trackEl.style.transition = 'none';
                }, { passive: true });

                rowEl.addEventListener('touchmove', (e) => {
                    if (!dragging) return;
                    const dx = e.touches[0].clientX - startX;
                    const delta = Math.round(-dx / 40);
                    setIndex(startIdx + delta, false);
                }, { passive: true });

                rowEl.addEventListener('touchend', () => {
                    dragging = false;
                    setIndex(currentIdx, true);
                });

                // Mouse
                rowEl.addEventListener('mousedown', (e) => {
                    startX = e.clientX;
                    startIdx = currentIdx;
                    dragging = true;
                    e.preventDefault();
                });
                window.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    const dx = e.clientX - startX;
                    const delta = Math.round(-dx / 40);
                    setIndex(startIdx + delta, false);
                });
                window.addEventListener('mouseup', () => {
                    if (!dragging) return;
                    dragging = false;
                    setIndex(currentIdx, true);
                });

                return { getIndex: () => currentIdx, setIndex };
            }

            const hourValues = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
            const minValues = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));

            let hoursWheel, minutesWheel;

            function updateTime() {
                if (!hoursWheel || !minutesWheel) return;
                const h = hourValues[hoursWheel.getIndex()];
                const m = minValues[minutesWheel.getIndex()];
                document.getElementById('ob-time').value = h + ':' + m;
            }

            hoursWheel = setupDrum(
                document.getElementById('drum-hours'),
                document.getElementById('track-hours'),
                hourValues, 12, updateTime
            );
            minutesWheel = setupDrum(
                document.getElementById('drum-minutes'),
                document.getElementById('track-minutes'),
                minValues, 0, updateTime
            );
            updateTime();
        }

        document.addEventListener('DOMContentLoaded', initTimeWheel);

        // Splash animation
        async function playSplash() {
            const emojis = ['🍼', '💩', '😴', '🔁'];
            const el = document.getElementById('splash-word');
            await new Promise(r => setTimeout(r, 100));
            for (const emoji of emojis) {
                el.textContent = emoji;
                el.style.opacity = '1';
                el.style.transform = 'scale(1)';
                await new Promise(r => setTimeout(r, 250));
                el.style.transform = 'scale(0.2)';
                el.style.opacity = '0';
                await new Promise(r => setTimeout(r, 150));
            }
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('onboarding').style.display = 'flex';
            }, 300);
        }

        // Step 1: Invite code logic
        function showInviteInput() {
            document.getElementById('invite-choice').style.display = 'none';
            document.getElementById('invite-input').style.display = 'block';
            document.getElementById('ob-invite').focus();
        }

        function hideInviteInput() {
            document.getElementById('invite-input').style.display = 'none';
            document.getElementById('invite-choice').style.display = 'flex';
        }

        const inviteInput = document.getElementById('ob-invite');
        inviteInput.addEventListener('input', () => {
            document.getElementById('btn-join').disabled = !inviteInput.value.trim();
        });

        function joinWithCode() {
            const code = document.getElementById('ob-invite').value.trim();
            console.log('Joining with invite code:', code);
            // In real app: POST code to API, then redirect
            window.location.href = '/';
        }

        // Enable continue only when name is filled
        const nameInput = document.getElementById('ob-name');
        nameInput.addEventListener('input', () => {
            document.getElementById('btn-step2').disabled = !nameInput.value.trim();
        });

        function pickGender(btn, gender) {
            selectedGender = gender;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Steps 2-5 have progress (step 1 is the invite gate, no progress bar)
        const totalOnboardingSteps = 4; // steps 2-5

        const progressEmojis = ['👶', '🎂', '⚖️', '✨'];

        function updateProgress(step) {
            // step 2=1st emoji, step 3=2nd, step 4=3rd, step 5=4th
            const progressStep = step - 1; // 1-based index into emojis
            for (let s = 2; s <= 5; s++) {
                const bar = document.getElementById('progress-' + s);
                if (!bar) continue;
                bar.innerHTML = '';
                for (let i = 1; i <= totalOnboardingSteps; i++) {
                    const dot = document.createElement('div');
                    const isDone = i < progressStep;
                    const isCurrent = i === progressStep;
                    dot.className = 'progress-dot' + (isDone ? ' done' : '') + (isCurrent ? ' current' : '');
                    dot.textContent = progressEmojis[i - 1];
                    bar.appendChild(dot);
                }
            }
        }

        function goStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + n).classList.add('active');
            if (n >= 2) updateProgress(n);
            if (n === 5) {
                renderSummary();
                // Set initial color dot based on gender
                if (!chosenBraceletColor) {
                    const defaultColor = selectedGender === 'girl' ? '#F08080' : selectedGender === 'boy' ? '#7EB8E0' : '#7ED67E';
                    document.querySelectorAll('.color-dot').forEach(d => {
                        d.classList.toggle('active', d.dataset.color === defaultColor);
                    });
                }
                initBracelet();
            }
        }

        updateProgress(2);

        function renderSummary() {
            const name = document.getElementById('ob-name').value.trim();
            const dob = document.getElementById('ob-dob').value;
            const time = document.getElementById('ob-time').value;
            const weight = document.getElementById('ob-weight').value;
            const hospital = document.getElementById('ob-hospital').value.trim();
            const genderLabel = selectedGender === 'boy' ? '👦 Boy' : selectedGender === 'girl' ? '👧 Girl' : '—';

            let dobDisplay = '—';
            if (dob) {
                const d = new Date(dob + (time ? 'T' + time : ''));
                dobDisplay = d.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
                if (time) dobDisplay += ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            const html = `
                <div class="summary-row">
                    <span class="summary-label">Name</span>
                    <span class="summary-value">${name || '—'}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Born</span>
                    <span class="summary-value">${dobDisplay}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Gender</span>
                    <span class="summary-value">${genderLabel}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Weight</span>
                    <span class="summary-value">${weight ? weight + 'g' : '—'}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Hospital</span>
                    <span class="summary-value">${hospital || '—'}</span>
                </div>
            `;
            document.getElementById('summary').innerHTML = html;
        }

        function enterApp() {
            const name = document.getElementById('ob-name').value.trim();
            const dob = document.getElementById('ob-dob').value;
            const time = document.getElementById('ob-time').value;
            const weight = document.getElementById('ob-weight').value;
            const hospital = document.getElementById('ob-hospital')?.value.trim() || '';

            console.log('Onboarding complete:', {
                baby_name: name,
                baby_birthdate: dob && time ? dob + 'T' + time : dob || null,
                baby_birth_weight: weight ? Number(weight) : null,
                baby_gender: selectedGender || null,
                baby_hospital: hospital || null,
            });

            // In real app, would save profile and redirect
            window.location.href = '/';
        }

        // --- 3D Bracelet ---
        let braceletScene = null;
        let chosenBraceletColor = null;

        function pickBraceletColor(btn) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.color === 'custom') {
                document.getElementById('custom-color-input').click();
                return;
            }
            chosenBraceletColor = btn.dataset.color;
            initBracelet();
        }

        function applyCustomColor(hex) {
            chosenBraceletColor = hex;
            const customBtn = document.querySelector('.color-dot-custom');
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            customBtn.classList.add('active');
            customBtn.style.background = hex;
            initBracelet();
        }

        async function initBracelet() {
            // Clear previous bracelet if any
            const container = document.getElementById('bracelet-container');
            container.innerHTML = '';

            const { Scene, PerspectiveCamera, WebGLRenderer, AmbientLight, DirectionalLight,
                    BufferGeometry, Float32BufferAttribute, Mesh, MeshPhysicalMaterial,
                    CylinderGeometry, Vector3, Color, ACESFilmicToneMapping, DoubleSide, CanvasTexture
            } = await import('https://esm.sh/three@0.171.0');
            const { OrbitControls } = await import('https://esm.sh/three@0.171.0/examples/jsm/controls/OrbitControls.js');

            const w = container.clientWidth;
            const h = Math.max(container.clientHeight, 350);

            const renderer = new WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(w, h);
            renderer.toneMapping = ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            container.appendChild(renderer.domElement);
            renderer.domElement.style.touchAction = 'none';

            const scene = new Scene();
            const camera = new PerspectiveCamera(30, w / h, 0.1, 100);
            camera.position.set(0.3, 0.8, 5.5);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.2;

            scene.add(new AmbientLight(0xffffff, 0.7));
            const key = new DirectionalLight(0xfff8ee, 1.4);
            key.position.set(4, 6, 5);
            scene.add(key);
            const fill = new DirectionalLight(0xeef0ff, 0.5);
            fill.position.set(-4, 3, -3);
            scene.add(fill);

            // Get baby info from form
            const name = document.getElementById('ob-name').value.trim() || 'Baby';
            const dob = document.getElementById('ob-dob').value;
            const timeVal = document.getElementById('ob-time').value;
            const weight = document.getElementById('ob-weight').value;
            const gender = selectedGender || '';
            const hospital = document.getElementById('ob-hospital')?.value.trim() || '';

            let dateStr = '';
            if (dob) {
                const d = new Date(dob + (timeVal ? 'T' + timeVal : ''));
                dateStr = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            }
            let timeStr = '';
            if (timeVal) {
                timeStr = new Date('2000-01-01T' + timeVal).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }

            function getZodiac(dateStr) {
                if (!dateStr) return null;
                const d = new Date(dateStr);
                const m = d.getMonth() + 1, day = d.getDate();
                const signs = [
                    { name: 'Capricorn',   emoji: '♑', end: [1, 19] },
                    { name: 'Aquarius',    emoji: '♒', end: [2, 18] },
                    { name: 'Pisces',      emoji: '♓', end: [3, 20] },
                    { name: 'Aries',       emoji: '♈', end: [4, 19] },
                    { name: 'Taurus',      emoji: '♉', end: [5, 20] },
                    { name: 'Gemini',      emoji: '♊', end: [6, 20] },
                    { name: 'Cancer',      emoji: '♋', end: [7, 22] },
                    { name: 'Leo',         emoji: '♌', end: [8, 22] },
                    { name: 'Virgo',       emoji: '♍', end: [9, 22] },
                    { name: 'Libra',       emoji: '♎', end: [10, 22] },
                    { name: 'Scorpio',     emoji: '♏', end: [11, 21] },
                    { name: 'Sagittarius', emoji: '♐', end: [12, 21] },
                    { name: 'Capricorn',   emoji: '♑', end: [12, 31] },
                ];
                for (const s of signs) {
                    if (m < s.end[0] || (m === s.end[0] && day <= s.end[1])) return s;
                }
                return signs[0];
            }

            const zodiac = getZodiac(dob);
            const bandColor = chosenBraceletColor || (gender === 'girl' ? '#F08080' : gender === 'boy' ? '#7EB8E0' : '#7ED67E');

            // --- Texture ---
            function createTex() {
                const c = document.createElement('canvas');
                const W = 2048, H = 512;
                c.width = W; c.height = H;
                const ctx = c.getContext('2d');

                ctx.fillStyle = bandColor;
                ctx.fillRect(0, 0, W, H);
                for (let i = 0; i < 4000; i++) {
                    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.015})`;
                    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
                }

                // Holes
                const bandLen = 5, bandFullW = 0.8, stripW = bandFullW * 0.35;
                const pxX = W / bandLen, pxY = H / stripW;
                const hr = 0.03;
                for (let i = 0; i < 5; i++) {
                    const hx = W * 0.05 + i * (W * 0.055);
                    const rx = hr * pxX, ry = hr * pxY;
                    ctx.save(); ctx.beginPath(); ctx.ellipse(hx, H/2, rx, ry, 0, 0, Math.PI*2); ctx.clip();
                    ctx.clearRect(hx-rx-2, H/2-ry-2, rx*2+4, ry*2+4); ctx.restore();
                    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(hx, H/2, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
                }

                // Right holes
                const rpy = H / bandFullW, rry = hr * rpy;
                for (let i = 0; i < 3; i++) {
                    const hx = W*0.82+i*(W*0.055), rx = hr*pxX;
                    ctx.save(); ctx.beginPath(); ctx.ellipse(hx,H/2,rx,rry,0,0,Math.PI*2); ctx.clip();
                    ctx.clearRect(hx-rx-2,H/2-rry-2,rx*2+4,rry*2+4); ctx.restore();
                    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=2;
                    ctx.beginPath(); ctx.ellipse(hx,H/2,rx,rry,0,0,Math.PI*2); ctx.stroke();
                }

                // Label
                const ls = W*0.48, le = W*0.78, lp = H*0.08, r = 4;
                ctx.fillStyle = 'rgb(244,240,232)';
                ctx.beginPath();
                ctx.moveTo(ls+r,lp); ctx.lineTo(le-r,lp); ctx.arcTo(le,lp,le,lp+r,r);
                ctx.lineTo(le,H-lp-r); ctx.arcTo(le,H-lp,le-r,H-lp,r);
                ctx.lineTo(ls+r,H-lp); ctx.arcTo(ls,H-lp,ls,H-lp-r,r);
                ctx.lineTo(ls,lp+r); ctx.arcTo(ls,lp,ls+r,lp,r); ctx.fill();

                // Grain + shadow
                ctx.save(); ctx.clip();
                for (let i = 0; i < 5000; i++) {
                    ctx.fillStyle = Math.random()<0.5 ? `rgba(0,0,0,${Math.random()*0.03})` : `rgba(255,255,255,${Math.random()*0.04})`;
                    ctx.fillRect(ls+Math.random()*(le-ls), lp+Math.random()*(H-lp*2), 1+Math.random(), 1);
                }
                const sg = ctx.createLinearGradient(0,lp,0,lp+25);
                sg.addColorStop(0,'rgba(0,0,0,0.12)'); sg.addColorStop(1,'rgba(0,0,0,0)');
                ctx.fillStyle=sg; ctx.fillRect(ls,lp,le-ls,25);
                ctx.restore();

                // Text
                ctx.save(); ctx.beginPath(); ctx.rect(ls,lp,le-ls,H-lp*2); ctx.clip();
                const tx = ls+28; let ty = H/2-95;
                ctx.fillStyle='#3a3530'; ctx.font='bold 46px system-ui,sans-serif';
                ctx.fillText(name, tx, ty); ty += 46;
                ctx.font='500 26px system-ui,sans-serif'; ctx.fillStyle='#6a6258';
                if (dateStr) { ctx.fillText('DOB: ' + dateStr + (timeStr ? '  ' + timeStr : ''), tx, ty); ty += 34; }
                ctx.font='500 22px system-ui,sans-serif';
                if (weight) { ctx.fillStyle='#6a6258'; ctx.fillText('WT:', tx, ty); ctx.fillStyle='#3a3530'; ctx.fillText(weight + 'g', tx+42, ty); }
                if (gender) { ctx.fillStyle='#6a6258'; ctx.fillText('SEX:', tx+180, ty); ctx.fillStyle='#3a3530'; ctx.fillText(gender.charAt(0).toUpperCase(), tx+232, ty); }
                ty += 30;
                if (hospital) { ctx.fillStyle='#6a6258'; ctx.fillText('HOSP:', tx, ty); ctx.fillStyle='#3a3530'; ctx.fillText(hospital, tx+70, ty); ty += 30; }
                if (zodiac) { ctx.font='500 22px system-ui,sans-serif'; ctx.fillStyle='#6a6258'; ctx.fillText(zodiac.emoji + ' ' + zodiac.name, tx, ty); ty += 30; }
                for (let i=0;i<45;i++) { ctx.fillStyle=`rgba(50,45,40,${0.7+Math.random()*0.25})`; ctx.fillRect(tx+i*6,ty,Math.random()>0.4?3:1.2,36); }
                ctx.restore();

                return new CanvasTexture(c);
            }

            // Band geometry
            const len=5, bw=0.8, drp=3, stripW2=bw*0.35, labelW2=bw;
            const uS=120, vS=8, verts=[], uvs=[], idx=[];
            for(let i=0;i<=uS;i++){
                const u=i/uS, x=(u-0.5)*len;
                const d=drp*(Math.cosh((u-0.5)*2.5)-1)/(Math.cosh(1.25)-1);
                let hw; const ts=0.35, te=0.45;
                if(u<ts)hw=stripW2/2;
                else if(u<te){const t=(u-ts)/(te-ts);hw=stripW2/2+(labelW2/2-stripW2/2)*(0.5-0.5*Math.cos(t*Math.PI));}
                else hw=labelW2/2;
                for(let j=0;j<=vS;j++){
                    const v=j/vS;
                    verts.push(x,(v-0.5)*2*hw,-d); uvs.push(u,v);
                    if(i<uS&&j<vS){const a=i*(vS+1)+j,b=a+1,c=a+(vS+1),d2=c+1;idx.push(a,c,b);idx.push(b,c,d2);}
                }
            }
            const geo=new BufferGeometry();
            geo.setAttribute('position',new Float32BufferAttribute(verts,3));
            geo.setAttribute('uv',new Float32BufferAttribute(uvs,2));
            geo.setIndex(idx); geo.computeVertexNormals();

            const mat = new MeshPhysicalMaterial({
                map:createTex(), color:0xffffff, roughness:0.7, clearcoat:0.15,
                clearcoatRoughness:0.6, sheen:0.4, sheenRoughness:0.8,
                sheenColor:new Color(0xe8e0d8), transparent:true, alphaTest:0.5, side:DoubleSide,
            });

            const band = new Mesh(geo, mat);

            // Snap button
            const snapR=bw*0.12;
            const snapGeo=new CylinderGeometry(snapR,snapR,0.01,32);
            const snapMat=new MeshPhysicalMaterial({color:0xfafafa,roughness:0.2,metalness:0.05,clearcoat:0.5});
            const snap=new Mesh(snapGeo,snapMat);
            const sU=0.97, droopAt=u=>drp*(Math.cosh((u-0.5)*2.5)-1)/(Math.cosh(1.25)-1);
            const sZ=-droopAt(sU), eps=0.001;
            const tan=new Vector3(eps*len,0,-(droopAt(sU+eps)-droopAt(sU))).normalize();
            const norm=new Vector3(-tan.z,0,tan.x).normalize();
            snap.quaternion.setFromUnitVectors(new Vector3(0,1,0),norm);
            snap.position.set(len*0.47,0,sZ+0.006);
            band.add(snap);

            // --- Entrance animation ---
            // Start: above screen, tiny, spinning
            const targetScale = 0.6;
            const targetRotX = -0.3;
            const targetY = 0;
            band.position.y = 6;          // start way above
            band.rotation.x = -0.3;
            band.rotation.y = Math.PI * 4; // 2 full spins
            band.scale.setScalar(0.1);     // start tiny

            scene.add(band);

            const animStart = performance.now();
            const animDuration = 2000; // 2 seconds
            let animDone = false;

            // Easing: cubic ease-out
            function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

            function animate(){
                requestAnimationFrame(animate);

                if (!animDone) {
                    const elapsed = performance.now() - animStart;
                    const t = Math.min(elapsed / animDuration, 1);
                    const e = easeOutCubic(t);

                    // Position: drop from above
                    band.position.y = 6 * (1 - e) + targetY * e;

                    // Scale: grow from tiny to target
                    const s = 0.1 + (targetScale - 0.1) * e;
                    band.scale.setScalar(s);

                    // Rotation: spin and settle
                    band.rotation.y = Math.PI * 4 * (1 - e);

                    if (t >= 1) {
                        animDone = true;
                        band.position.y = targetY;
                        band.scale.setScalar(targetScale);
                        band.rotation.y = 0;
                        controls.autoRotate = true;
                        controls.autoRotateSpeed = 1.2;
                    }
                }

                controls.update();
                renderer.render(scene,camera);
            }
            animate();

            // Handle resize
            const ro = new ResizeObserver(() => {
                const nw = container.clientWidth, nh = Math.max(container.clientHeight, 350);
                camera.aspect = nw / nh;
                camera.updateProjectionMatrix();
                renderer.setSize(nw, nh);
            });
            ro.observe(container);
        }

        playSplash();
    </script>
    <script>
    if (location.hostname.includes('-dev')) {
        var s = document.createElement('script');
        s.src = 'lib/dev-helper.js';
        document.body.appendChild(s);
    }
    </script>
